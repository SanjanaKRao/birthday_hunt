<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell">
        <section class="card final-card">
            <div class="cat-parade" aria-hidden="true">
                <svg class="cat-illustration" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M31 35L45 17L56 39" fill="#FFCBBE" stroke="#725766" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M89 35L75 17L64 39" fill="#FFCBBE" stroke="#725766" stroke-width="4" stroke-linejoin="round"/>
                    <circle cx="60" cy="62" r="31" fill="#FFE7DE" stroke="#725766" stroke-width="4"/>
                    <circle cx="49" cy="59" r="4" fill="#725766"/>
                    <circle cx="71" cy="59" r="4" fill="#725766"/>
                    <path d="M60 65L56 70H64L60 65Z" fill="#FF9FB3"/>
                    <path d="M60 70C58 74 55 76 51 76" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M60 70C62 74 65 76 69 76" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M28 65H47" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M25 73H45" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M73 65H92" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M75 73H95" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <svg class="cat-illustration party flip" viewBox="0 0 120 132" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M31 45L45 27L56 49" fill="#D9F4E7" stroke="#725766" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M89 45L75 27L64 49" fill="#D9F4E7" stroke="#725766" stroke-width="4" stroke-linejoin="round"/>
                    <circle cx="60" cy="72" r="31" fill="#F4FFF9" stroke="#725766" stroke-width="4"/>
                    <path d="M48 17L79 47H39L48 17Z" fill="#FF8FA6" stroke="#725766" stroke-width="4" stroke-linejoin="round"/>
                    <circle cx="48" cy="13" r="5" fill="#FFD974"/>
                    <circle cx="49" cy="69" r="4" fill="#725766"/>
                    <circle cx="71" cy="69" r="4" fill="#725766"/>
                    <path d="M60 75L56 80H64L60 75Z" fill="#FF9FB3"/>
                    <path d="M60 80C57 84 54 86 50 86" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M60 80C63 84 66 86 70 86" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M28 75H47" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M25 83H45" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M73 75H92" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                    <path d="M75 83H95" stroke="#725766" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>

            <span class="seal">To the love of my life</span>

            <div class="title-block">
                <h1>Happy birthday ❤️</h1>
                <p class="lead">Did you have fun??</p>
            </div>

            <div class="choice-panel" id="choice-panel">
                <a class="button" href="{{ url_for('celebrate') }}">Hell yeahhh!!</a>
                <button type="button" class="button tease-button no-button" id="no-button">Could be better :(</button>
            </div>
        </section>
    </main>
    <script>
        const noButton = document.getElementById("no-button");
        const choicePanel = document.getElementById("choice-panel");

        function moveNoButton() {
            if (!noButton || !choicePanel) {
                return;
            }

            const minLeft = noButton.offsetWidth / 2;
            const maxLeft = Math.max(minLeft, choicePanel.clientWidth - (noButton.offsetWidth / 2));
            const minTop = 110;
            const maxTop = Math.max(minTop, choicePanel.clientHeight - noButton.offsetHeight - 16);
            const nextLeft = Math.floor(Math.random() * (maxLeft - minLeft + 1)) + minLeft;
            const nextTop = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

            noButton.style.setProperty("--no-left", `${nextLeft}px`);
            noButton.style.setProperty("--no-top", `${nextTop}px`);
        }

        if (noButton) {
            const teaseHandler = (event) => {
                event.preventDefault();
                moveNoButton();
            };

            noButton.addEventListener("pointerenter", teaseHandler);
            noButton.addEventListener("pointermove", teaseHandler);
            noButton.addEventListener("pointerdown", teaseHandler);
            noButton.addEventListener("click", teaseHandler);
        }
    </script>
</body>
</html>
